name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                 # tags, for fcvm_version
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: tests/run lint unit
        shell: bash
        run: tests/run lint unit 2>&1 | tee checks.log
      - name: Report
        if: failure()
        run: tests/tools/ci-report.sh checks.log

  integration:
    name: integration tests (fresh runner, real VMs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: KVM access
        # GitHub's Linux runners expose /dev/kvm; open it to the runner user.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Newest stable kernel (for the cache key)
        id: kernel
        run: echo "version=$(curl -fsSL https://www.kernel.org/releases.json | jq -r .latest_stable.version)" >> "$GITHUB_OUTPUT"
      - name: Cache the guest kernel
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/fcvm/kernels
            ~/.local/share/fcvm/cache
          key: kernel-${{ steps.kernel.outputs.version }}-${{ hashFiles('kernel/*.config') }}
      - name: fcvm setup -y
        shell: bash
        run: ./fcvm setup -y 2>&1 | tee setup.log
      - name: Integration tests
        shell: bash
        run: tests/run integration -v 2>&1 | tee tests.log
      - name: Report
        if: failure()
        run: tests/tools/ci-report.sh setup.log tests.log
