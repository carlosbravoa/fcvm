# Egress allowlist presets for `fcvm ... --allow @NAME`.
# One preset per line: @name followed by host patterns ("*.x" = subdomains,
# "host:port" = a specific port; without a port, 80 and 443 are allowed).
# Add your own here (e.g. an internal registry mirror).
@pypi      pypi.org files.pythonhosted.org
@npm       registry.npmjs.org registry.yarnpkg.com
@github    github.com *.github.com *.githubusercontent.com codeload.github.com
@gitlab    gitlab.com *.gitlab.com
@golang    proxy.golang.org sum.golang.org storage.googleapis.com
@crates    crates.io static.crates.io index.crates.io
@rubygems  rubygems.org *.rubygems.org
@maven     repo.maven.apache.org repo1.maven.org
@ubuntu    archive.ubuntu.com security.ubuntu.com *.archive.ubuntu.com ports.ubuntu.com
@debian    deb.debian.org security.debian.org
@alpine    dl-cdn.alpinelinux.org
@anthropic api.anthropic.com
