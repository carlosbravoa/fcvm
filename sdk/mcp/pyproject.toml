[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fcvm-mcp"
version = "0.7.0"
description = "Launches fcvm's MCP server: Firecracker microVM sandboxes as tools for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Carlos Bravo"}]
requires-python = ">=3.9"
keywords = ["mcp", "mcp-server", "firecracker", "microvm", "sandbox", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]

[project.scripts]
fcvm-mcp = "fcvm_mcp:main"

[project.urls]
Homepage = "https://github.com/carlosbravoa/fcvm"
Documentation = "https://github.com/carlosbravoa/fcvm/blob/main/docs/agents.md"
Issues = "https://github.com/carlosbravoa/fcvm/issues"
Changelog = "https://github.com/carlosbravoa/fcvm/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["fcvm_mcp"]
