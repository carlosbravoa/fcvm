[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fcvm"
version = "0.7.0"
description = "A client for the fcvm HTTP API: Firecracker microVM sandboxes from Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Carlos Bravo"}]
requires-python = ">=3.9"
keywords = ["firecracker", "microvm", "sandbox", "ai-agents", "virtualization", "isolation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/carlosbravoa/fcvm"
Documentation = "https://github.com/carlosbravoa/fcvm/blob/main/sdk/README.md"
Issues = "https://github.com/carlosbravoa/fcvm/issues"
Changelog = "https://github.com/carlosbravoa/fcvm/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["fcvm"]
