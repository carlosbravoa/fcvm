[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcvm"
version = "0.7.0"
description = "A client for the fcvm HTTP API: Firecracker microVM sandboxes from Python"
readme = "../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.urls]
Homepage = "https://github.com/carlosbravoa/fcvm"

[tool.setuptools]
py-modules = ["fcvm"]
